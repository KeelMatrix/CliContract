name: Publish package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          global-json-file: global.json
      - name: Verify workflow definitions
        shell: pwsh
        run: ./scripts/verify-workflow-safety.ps1
      - name: Verify release tag
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/verify-release-tag.ps1 -Tag $env:TAG_NAME -OutputEnvironmentFile $env:GITHUB_ENV
      - name: Verify release contract
        shell: pwsh
        run: ./scripts/verify-release-contract.ps1 -Version $env:RELEASE_VERSION -Tag $env:GITHUB_REF_NAME
      - name: Build and validate package
        shell: pwsh
        run: ./scripts/local-gate.ps1
      - name: Verify exact release artifacts
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -ArtifactDirectory ./artifacts/packages -Version $env:RELEASE_VERSION
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen
      - name: Publish exact package artifacts
        shell: pwsh
        env:
          NUGET_TEMPORARY_CREDENTIAL: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: ./scripts/publish-package.ps1 -Package (Join-Path './artifacts/packages' "KeelMatrix.CliContract.$env:RELEASE_VERSION.nupkg") -Symbols (Join-Path './artifacts/packages' "KeelMatrix.CliContract.$env:RELEASE_VERSION.snupkg") -Credential $env:NUGET_TEMPORARY_CREDENTIAL
